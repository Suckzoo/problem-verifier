name: icpc-verify judge
description: solution 하나를 채점하고 결과 artifact 를 올린다
inputs:
  problem-dir:
    default: "."
  solution:
    required: true
  name:
    required: true
  judge-image:
    default: ""
  judge-all:
    default: "false"
  verdict-match:
    default: "exact"
  default-time-limit:
    default: "1"
  default-memory-mib:
    default: "2048"
  timelimit-overshoot:
    default: "2s|20%"
  output-limit-mib:
    default: "8"
  required-cpu-flags:
    default: "avx2"
  judge-cpu:
    default: ""
  offline-sibling:
    default: "true"
  diff-max-cases:
    default: "3"
  diff-max-bytes:
    default: "4096"
  compile-flags-cpp:
    default: ""
  compile-flags-c:
    default: ""
  compile-flags-java:
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}/.."
    - shell: bash
      run: |
        set -eu
        IMAGE="${{ inputs.judge-image }}"
        if [ -z "$IMAGE" ]; then
          IMAGE="$(cat "${{ github.action_path }}/../image/IMAGE_DIGEST")"
        fi
        echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        docker pull -q "$IMAGE"
        echo "JUDGE_IMAGE=$IMAGE" >> "$GITHUB_ENV"
    - shell: bash
      run: |
        set -eu
        args=(--problem-dir "${{ inputs.problem-dir }}"
              --solution "${{ inputs.solution }}"
              --output "result-${{ inputs.name }}.json"
              --image "$JUDGE_IMAGE"
              --verdict-match "${{ inputs.verdict-match }}"
              --default-time-limit "${{ inputs.default-time-limit }}"
              --default-memory-mib "${{ inputs.default-memory-mib }}"
              --timelimit-overshoot "${{ inputs.timelimit-overshoot }}"
              --output-limit-mib "${{ inputs.output-limit-mib }}"
              --required-cpu-flags "${{ inputs.required-cpu-flags }}"
              --diff-max-cases "${{ inputs.diff-max-cases }}"
              --diff-max-bytes "${{ inputs.diff-max-bytes }}")
        if [ "${{ inputs.judge-all }}" = "true" ]; then args+=(--judge-all); fi
        if [ -n "${{ inputs.judge-cpu }}" ]; then args+=(--judge-cpu "${{ inputs.judge-cpu }}"); fi
        if [ "${{ inputs.offline-sibling }}" != "true" ]; then args+=(--no-offline-sibling); fi
        if [ -n "${{ inputs.compile-flags-cpp }}" ]; then args+=(--compile-flags-cpp "${{ inputs.compile-flags-cpp }}"); fi
        if [ -n "${{ inputs.compile-flags-c }}" ]; then args+=(--compile-flags-c "${{ inputs.compile-flags-c }}"); fi
        if [ -n "${{ inputs.compile-flags-java }}" ]; then args+=(--compile-flags-java "${{ inputs.compile-flags-java }}"); fi
        icpc-verify judge "${args[@]}" || status=$?
        # exit 1(기대 불일치)은 result.json 이 있으므로 report 가 판정한다.
        # exit 2(설정/인프라 오류)만 job 실패로 만든다.
        status=${status:-0}
        if [ "$status" -ge 2 ]; then exit "$status"; fi
    - uses: actions/upload-artifact@v4
      with:
        name: icpc-verify-result-${{ inputs.name }}
        path: result-${{ inputs.name }}.json
        if-no-files-found: error
